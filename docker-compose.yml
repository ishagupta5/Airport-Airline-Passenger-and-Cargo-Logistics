version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: airport_dbms_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-airport_logistics_db}
      MYSQL_USER: ${MYSQL_USER:-airport_admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-airport_secure_pass_2026}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql:ro
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --sql_mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: airport_dbms_server
    restart: unless-stopped
    volumes:
      - ./server:/app
      - /app/node_modules
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-airport_logistics_db}
      DB_USER: ${MYSQL_USER:-airport_admin}
      DB_PASSWORD: ${MYSQL_PASSWORD:-airport_secure_pass_2026}
      DB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      JWT_SECRET: ${JWT_SECRET:-super_secret_airport_jwt_token_key_2026}
      CORS_ORIGIN: "http://localhost:5173"
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: airport_dbms_web
    restart: unless-stopped
    volumes:
      - ./web:/app
      - /app/node_modules
    environment:
      VITE_API_URL: "http://server:3000"
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  mysql_data:
    driver: local
